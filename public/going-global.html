      if(p.to===fl.to&&dd<LOOP/3)return true;        /* the same city is not served twice in a row */

  order.forEach(function(e){if(!rl[e.i].ok)tryPlace(e);});

  window.__dropped=DROPPED;

function sizeAll(){
  var w=window.innerWidth,h=window.innerHeight,s=Math.max(w/SW,h/SH),dpr=Math.min(window.devicePixelRatio||1,3);
  stage.style.transform='translate('+((w-SW*s)/2)+'px,0) scale('+s+')';
  /* maximum quality: the canvases follow the real pixels of the screen (up to QCAP x the 1920 design width) */
  KS=qs.has('w')?parseFloat(qs.get('w'))/SW:Math.min(s*dpr,QCAP)*QF;
  var maxd=8192;try{if(GLOK)maxd=Math.min(gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0],gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));}catch(e){}
  KS=Math.min(KS,maxd/SW,Math.sqrt(36e6/(SW*SH)));if(KS<.5)KS=.5;
  var cw=Math.round(SW*KS),ch=Math.round(SH*KS);
  [glc,ttc,fxc,fgc].forEach(function(c){c.width=cw;c.height=ch;});
  UPX=cw/SW;
  if(GLOK)gl.viewport(0,0,cw,ch);
  drawStatic();
}

    fx.globalCompositeOperation='lighter';fx.globalAlpha=g2_*.55;fx.drawImage(SPR.white,px_-psz*.95,py_-psz*.95,psz*1.9,psz*1.9);
    fx.globalCompositeOperation='source-over';
    fx.save();fx.translate(px_,py_);fx.rotate(ang+bank);fx.scale(psz,psz*sq);fx.globalAlpha=g2_;fx.fillStyle='#ffffff';fx.fill(PLANE);fx.restore();
  }
  fx.globalAlpha=1;
}

/* =====================================================================
   Pointer: the particles around the cursor scatter and then glide back
   ===================================================================== */
var MU=new Float32Array(64),MN=0,MS={x:0,y:0,tx:0,ty:0,ls:0,on:false,last:0,tr:[],lx:-1e4,ly:-1e4,lt:0};
function toStage(cx,cy){var w=window.innerWidth,h=window.innerHeight,s=Math.max(w/SW,h/SH);return [(cx-(w-SW*s)/2)/s,cy/s];}
/* a touch swells in slowly (ease-in), reaches its peak, then relaxes: the particles lift off softly and settle back */
function envl(a,ta,td){if(a<=0)return 0;if(a<ta){var x=a/ta;return x*x*(3-2*x);}return Math.exp(-(a-ta)/td);}
function addImpulse(x,y,k,r,now,burst){var tr=MS.tr;tr.push({x:x,y:y,t:now,k:k,r:r,b:!!burst});if(tr.length>16)tr.shift();}
function onMove(e){
  var q=toStage(e.clientX,e.clientY),now=NOWMS||performance.now();
  MS.tx=q[0];MS.ty=q[1];
  if(!MS.on){MS.on=true;MS.x=q[0];MS.y=q[1];}
  var dx=q[0]-MS.lx,dy=q[1]-MS.ly;
  if(dx*dx+dy*dy>16*16||now-MS.lt>140){addImpulse(q[0],q[1],1,80,now);MS.lx=q[0];MS.ly=q[1];MS.lt=now;}
}
function onDown(e){var q=toStage(e.clientX,e.clientY),now=NOWMS||performance.now();MS.tx=q[0];MS.ty=q[1];if(!MS.on){MS.on=true;MS.x=q[0];MS.y=q[1];}addImpulse(q[0],q[1],1.7,190,now,true);}
function offPtr(){MS.on=false;}
function updPointer(now){
  NOWMS=now;
  var dt=Math.max(0,Math.min(.1,(now-(MS.last||now))/1000));MS.last=now;
  var a=1-Math.exp(-dt/.14);MS.x+=(MS.tx-MS.x)*a;MS.y+=(MS.ty-MS.y)*a;
  MS.ls+=((MS.on?1:0)-MS.ls)*(1-Math.exp(-dt/.22));
  var n=0,i,tr=MS.tr;
  if(MS.ls>.02){MU[0]=MS.x;MU[1]=MS.y;MU[2]=.36*MS.ls;MU[3]=90;n=1;}
  for(i=tr.length-1;i>=0;i--){
    var T=tr[i],age=(now-T.t)/1000;
    if(age>3.6){tr.splice(0,i+1);break;}
    var st=T.k*(T.b?envl(age,.20,.85):envl(age,.50,.85));
    if(st<.02||n>=16)continue;
    MU[n*4]=T.x;MU[n*4+1]=T.y;MU[n*4+2]=st;MU[n*4+3]=T.r;n++;
  }
  MN=n;
}
window.addEventListener('pointermove',function(e){if(e.pointerType==='touch'&&!MS.on)return;onMove(e);},{passive:true});
window.addEventListener('pointerdown',function(e){onDown(e);},{passive:true});
window.addEventListener('pointerup',function(e){if(e.pointerType==='touch')offPtr();},{passive:true});
window.addEventListener('pointercancel',offPtr);
document.documentElement.addEventListener('mouseleave',offPtr);
window.addEventListener('blur',offPtr);
window.__ptr={move:function(x,y){onMove({clientX:x,clientY:y,pointerType:'mouse'});},down:function(x,y){onDown({clientX:x,clientY:y});},upd:updPointer,off:offPtr};

/* =====================================================================
   Frame
   ===================================================================== */
var VNOW={cl:1,sl:0,cp:1,sp:0}, errorShown=false;
var EMBED_PAUSED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var EMBED_VISIBLE=true, EMBED_FRAME=null, EMBED_LAST=null, EMBED_TIME=FIXT||0, EMBED_TICK=null;
function syncEmbedPlayback(){
  var active=!STILL&&!EMBED_PAUSED&&EMBED_VISIBLE&&!document.hidden;
  if(!active){if(EMBED_FRAME!==null)cancelAnimationFrame(EMBED_FRAME);EMBED_FRAME=null;EMBED_LAST=null;}
  else if(EMBED_TICK&&EMBED_FRAME===null)EMBED_FRAME=requestAnimationFrame(EMBED_TICK);
}
window.addEventListener('message',function(e){
  if(e.source!==window.parent||e.origin!==window.location.origin||!e.data||e.data.type!=='conference-globe-state')return;
  EMBED_PAUSED=!!e.data.paused;EMBED_VISIBLE=!!e.data.visible;syncEmbedPlayback();
});
document.addEventListener('visibilitychange',syncEmbedPlayback);
function render(t){
  t=mod(t,LOOP);
  var ph=TAU*(t+(window.__dt||0))/LOOP;
  viewAt(t,VNOW);
  /* effects first: they also fill the ripple uniforms used by the particle surface */
  renderFX(t,VNOW,ph);
  if(GLOK)renderGL(t,VNOW,ph);else if(FB)renderFallback(t,VNOW,ph);
}
window.__render=render;window.__LOOP=LOOP;window.__view=function(t){return viewAt(t,{cl:1,sl:0,cp:1,sp:0});};
window.__delta=deltaOfT;
window.__city=function(c,t){var V=viewAt(t,{cl:1,sl:0,cp:1,sp:0}),o=[0,0,0];proj(CV[c],V,1,o);return [Math.round(o[0]),Math.round(o[1]),+o[2].toFixed(2)];};

function start(){
  try{GLOK=initGL();if(GLOK)initGLData();}catch(e){console.warn('WebGL unavailable, using the 2D fallback',e);GLOK=false;}
  if(!GLOK){try{gl=null;var c2=glc.cloneNode(false);glc.parentNode.replaceChild(c2,glc);glc=c2;glc.id='gl';initFallback();}catch(e2){console.error(e2);}}
  sizeAll();
  window.__glok=GLOK;window.__nstars=NSTARS;
  var T0=performance.now(),gLast=0,gT=0,gBuf=[];
  function frame(now){
    EMBED_FRAME=null;
    if(EMBED_LAST!==null)EMBED_TIME=(EMBED_TIME+Math.min((now-EMBED_LAST)/1000,.1))%LOOP;
    EMBED_LAST=now;
    var t=FIXT!=null?FIXT:EMBED_TIME;
    updPointer(now);
    try{render(t);}catch(e){if(!errorShown){errorShown=true;console.error(e);}}
    /* guard against a slideshow: if the machine cannot keep up, the canvases lose resolution step by step */
    if(GOV&&!qs.has('w')){var dt=now-gLast;gLast=now;if(dt>0&&dt<1000){gBuf.push(dt);if(gBuf.length>72)gBuf.shift();}
      if(now-T0>3000&&now-gT>1800&&gBuf.length>=40){gT=now;var md=gBuf.slice().sort(function(x,y){return x-y;})[gBuf.length>>1];
        if(md>46&&QF>.5){QF*=.82;sizeAll();gBuf.length=0;}}}
    syncEmbedPlayback();
  }
  EMBED_TICK=frame;
  render(FIXT||0);
  syncEmbedPlayback();
}
window.addEventListener('resize',function(){sizeAll();if(fontReady&&EMBED_TICK)render(FIXT!=null?FIXT:EMBED_TIME);});
var fontsDone=false;
function go(){if(fontsDone)return;fontsDone=true;fontReady=true;start();}
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('300 100px MetropolisEmb'),document.fonts.load('500 100px MetropolisEmb')]).then(go,go);
  setTimeout(go,2500);
}else go();
})();
</script>
